<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ef4b25">
  <title>Zubbo indisponível</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#171717;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;text-align:center}
    main{padding:2rem;max-width:24rem}
    h1{font-size:1.5rem}p{line-height:1.5;color:#ddd}
    button{border:0;border-radius:.65rem;background:#ef4b25;color:#fff;font:inherit;font-weight:700;padding:.85rem 1.5rem;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Zubbo indisponível</h1>
    <p>Confira sua conexão com a internet. Se ela estiver funcionando, o servidor pode estar temporariamente indisponível.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
