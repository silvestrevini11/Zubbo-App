name: Demo MySQL Integration

on:
  push:
    branches:
      - teste-railway
      - teste-alteracoes
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  db-smoke:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_DATABASE: zubbo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4 + PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, mbstring, openssl, fileinfo
          tools: composer:v2

      - name: Composer install (Web Push)
        working-directory: ./-TCC-
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer check-platform-reqs

      - name: Validar biblioteca Web Push / VAPID
        working-directory: ./-TCC-
        run: |
          php tests/push-library-smoke.php

      - name: Backup do banco efêmero vazio antes do schema
        env:
          MYSQL_PWD: ci_only_password
        run: mysqldump --host=127.0.0.1 --port=3306 --user=root --no-tablespaces zubbo_ci > "$RUNNER_TEMP/zubbo-ci-before.sql"

      - name: Database integration smoke
        working-directory: ./-TCC-
        env:
          ZUBBO_DB_HOST: 127.0.0.1
          ZUBBO_DB_PORT: 3306
          ZUBBO_DB_USER: root
          ZUBBO_DB_PASSWORD: ci_only_password
          ZUBBO_DB_NAME: zubbo_ci
          ZUBBO_TEST_ALLOW_SCHEMA: '1'
        run: php tests/db-smoke.php

      - name: Auditoria estrita da instalação nova
        working-directory: ./-TCC-
        env:
          ZUBBO_DB_HOST: 127.0.0.1
          ZUBBO_DB_PORT: 3306
          ZUBBO_DB_USER: root
          ZUBBO_DB_PASSWORD: ci_only_password
          ZUBBO_DB_NAME: zubbo_ci
        run: php tests/audit-migrations.php --strict

      - name: Conferir contrato gerado das seis migrations
        working-directory: ./-TCC-
        run: php database/tools/migration-contract.php

      - name: Criar banco descartável separado para upgrades
        env:
          MYSQL_PWD: ci_only_password
        run: mysql --host=127.0.0.1 --port=3306 --user=root -e 'CREATE DATABASE zubbo_test_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'

      - name: Upgrades legados, parciais, reexecução e conflitos
        working-directory: ./-TCC-
        env:
          ZUBBO_DB_HOST: 127.0.0.1
          ZUBBO_DB_PORT: 3306
          ZUBBO_DB_USER: root
          ZUBBO_DB_PASSWORD: ci_only_password
          ZUBBO_DB_NAME: zubbo_test_upgrade
          ZUBBO_TEST_ALLOW_SCHEMA: '1'
        run: |
          php tests/db-upgrade.php
          php tests/audit-migrations.php --strict

      - name: Fluxos HTTP locais
        working-directory: ./-TCC-
        env:
          ZUBBO_DB_HOST: 127.0.0.1
          ZUBBO_DB_PORT: 3306
          ZUBBO_DB_USER: root
          ZUBBO_DB_PASSWORD: ci_only_password
          ZUBBO_DB_NAME: zubbo_ci
          ZUBBO_TEST_ALLOW_SCHEMA: '1'
          ZUBBO_TEST_BASE_URL: http://127.0.0.1:8999
          ZUBBO_BASE_PATH: /
          ZUBBO_ENV: test
          ZUBBO_DEMO_MODE: 'true'
        run: |
          mkdir -p .local/logs
          php -S 127.0.0.1:8999 router.php > .local/logs/zubbo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8999/health.php > /dev/null; then break; fi
            sleep 1
          done
          php tests/http-smoke.php

      - name: Backup e restauração em banco descartável separado
        working-directory: ./-TCC-
        env:
          MYSQL_PWD: ci_only_password
          ZUBBO_DB_HOST: 127.0.0.1
          ZUBBO_DB_PORT: 3306
          ZUBBO_DB_USER: root
          ZUBBO_DB_PASSWORD: ci_only_password
          ZUBBO_DB_NAME: zubbo_test_restore
        run: |
          mysqldump --host=127.0.0.1 --port=3306 --user=root --no-tablespaces --single-transaction zubbo_ci > "$RUNNER_TEMP/zubbo-ci-restore.sql"
          mysql --host=127.0.0.1 --port=3306 --user=root -e 'CREATE DATABASE zubbo_test_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql --host=127.0.0.1 --port=3306 --user=root zubbo_test_restore < "$RUNNER_TEMP/zubbo-ci-restore.sql"
          for database in zubbo_ci zubbo_test_restore; do
            mysqldump --host=127.0.0.1 --port=3306 --user=root --no-tablespaces --no-create-info --skip-extended-insert --skip-comments --compact --order-by-primary --hex-blob "$database" > "$RUNNER_TEMP/$database-data.sql"
          done
          cmp -s "$RUNNER_TEMP/zubbo_ci-data.sql" "$RUNNER_TEMP/zubbo_test_restore-data.sql"
          php tests/audit-migrations.php --strict
