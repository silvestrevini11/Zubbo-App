name: Railway Readiness

on:
  push:
    branches:
      - teste-railway
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql

      - name: Validate Composer
        working-directory: ./-TCC-
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        run: find ./-TCC- -path './-TCC-/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check Railway entry files
        run: |
          test -f ./-TCC-/index.php
          test -f ./-TCC-/health.php
          test -f ./-TCC-/public/index.php
          test -f ./-TCC-/config/database.php
          test -f ./-TCC-/database/scripts/criacaotables.sql
          test -f ./-TCC-/database/scripts/insertstables.sql

      - name: Check base path helper
        run: |
          ZUBBO_BASE_PATH=/ php -r "require './-TCC-/config/security.php'; if (zubbo_url('/public/index.php') !== '/public/index.php') { fwrite(STDERR, 'URL base invalida'.PHP_EOL); exit(1); }"

      - name: Reject local-only runtime paths
        shell: bash
        run: |
          if grep -RInE "/Zubbo-[Aa]pp/-TCC-|/-TCC-/public|/\.\./-TCC-|\.\./login/login\.php|\.\./usuario/form-usuario\.php" ./-TCC-/app ./-TCC-/public; then
            echo "Foram encontrados caminhos locais ou rotas antigas incompatíveis com o Railway."
            exit 1
          fi

      - name: Check managed-database SQL
        shell: bash
        run: |
          if grep -nE "^[[:space:]]*(CREATE DATABASE|USE[[:space:]]+app_zubbo)" ./-TCC-/database/scripts/criacaotables.sql ./-TCC-/database/scripts/insertstables.sql; then
            echo "Os scripts SQL ainda selecionam/criam um banco fixo."
            exit 1
          fi

      - name: HTTP smoke for Railway router
        shell: bash
        working-directory: ./-TCC-
        run: |
          ZUBBO_BASE_PATH=/ php -S 127.0.0.1:8999 router.php > /tmp/zubbo-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8999/health.php)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8999/)" = "302"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8999/app/views/auth/login.php)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8999/app/views/painel/sugestoes-busca.php)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8999/public/css/style.css)" = "200"
          for path in config/database.php database/scripts/criacaotables.sql vendor/autoload.php RAILWAY_TEST.md router.php app/views/admin/_auth.php; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8999/$path")" = "404"
          done
          grep -q '"status":"ok"' <(curl -sS http://127.0.0.1:8999/health.php)
          # Todas as ações sensíveis recusam POST sem CSRF e GET não permitido.
          for path in app/views/notificacoes/aceitar-amizade.php app/views/perfil/adicionar-amigo.php app/views/chats/enviar-mensagem.php; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:8999/$path")" = "403"
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8999/$path")" = "405"
          done
