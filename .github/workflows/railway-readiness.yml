name: Railway Readiness

on:
  push:
    branches:
      - teste-railway
      - teste-alteracoes
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, curl, mbstring, openssl, fileinfo
          tools: composer:v2

      - name: Validate Composer
        working-directory: ./-TCC-
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer check-platform-reqs

      - name: Check PHP syntax
        run: find ./-TCC- -path './-TCC-/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Privacy and security regression smoke
        working-directory: ./-TCC-
        run: php tests/security-smoke.php

      - name: Group moderation permissions and succession
        working-directory: ./-TCC-
        run: php tests/group-moderation-smoke.php

      - name: Banishment cleanup and rollback
        working-directory: ./-TCC-
        run: php tests/banishment-smoke.php

      - name: Check Railway entry files
        run: |
          test -f ./-TCC-/index.php
          test -f ./-TCC-/health.php
          test -f ./-TCC-/public/index.php
          test -f ./-TCC-/config/database.php
          test -f ./-TCC-/database/scripts/criacaotables.sql
          test -f ./-TCC-/database/scripts/insertstables.sql

      - name: Validar imagem opt-in de demo.02
        run: docker build --file ./-TCC-/Dockerfile.demo02 --tag zubbo-demo02:${{ github.sha }} ./-TCC-

      - name: Check base path helper
        run: |
          ZUBBO_BASE_PATH=/ php -r "require './-TCC-/config/security.php'; if (zubbo_url('/public/index.php') !== '/public/index.php') { fwrite(STDERR, 'URL base invalida'.PHP_EOL); exit(1); }"

      - name: Reject local-only runtime paths
        shell: bash
        run: |
          if grep -RInE "/Zubbo-[Aa]pp/-TCC-|/-TCC-/public|/\.\./-TCC-|\.\./login/login\.php|\.\./usuario/form-usuario\.php" ./-TCC-/app ./-TCC-/public; then
            echo "Foram encontrados caminhos locais ou rotas antigas incompatíveis com o Railway."
            exit 1
          fi

      - name: Check managed-database SQL
        shell: bash
        run: |
          if grep -nE "^[[:space:]]*(CREATE DATABASE|USE[[:space:]]+app_zubbo)" ./-TCC-/database/scripts/criacaotables.sql ./-TCC-/database/scripts/insertstables.sql; then
            echo "Os scripts SQL ainda selecionam/criam um banco fixo."
            exit 1
          fi

      - name: Mapa e biblioteca Web Push
        working-directory: ./-TCC-
        run: |
          php tests/map-config-smoke.php
          php tests/push-library-smoke.php
          php tests/environment-readiness-smoke.php

      - name: Sintaxe do verificador PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '-TCC-/tests/railway-readonly.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: HTTP smoke for Railway router
        shell: bash
        working-directory: ./-TCC-
        env:
          ZUBBO_BASE_PATH: /
          ZUBBO_TEST_BASE_URL: http://127.0.0.1:8999
        run: |
          mkdir -p .local/logs
          php -S 127.0.0.1:8999 router.php > .local/logs/router-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8999/health.php > /dev/null; then break; fi
            sleep 1
          done
          php tests/router-smoke.php
